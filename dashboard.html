<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiblu's Workspace</title>
<style>
  :root{
    --bg:#0a0e1a;
    --bg2:#0d1220;
    --card:rgba(22,27,34,0.7);
    --border:rgba(255,255,255,0.08);
    --text:#e6edf3;
    --muted:#8b98a9;
    --accent:#7c5cff;
    --accent2:#22d3ee;
    --green:#3fb950;
    --amber:#f0b429;
    --pink:#ff5c8a;
    --shadow:0 8px 32px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(800px circle at 15% 0%, rgba(124,92,255,0.15), transparent 40%),
      radial-gradient(700px circle at 85% 10%, rgba(34,211,238,0.12), transparent 40%),
      var(--bg);
    color:var(--text);
    padding:32px 24px;
    min-height:100vh;
    line-height:1.6;
  }
  /* HEADER */
  header{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-bottom:28px;flex-wrap:wrap;gap:12px;
    padding-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  .title-wrap h1{
    font-size:30px;font-weight:800;letter-spacing:-0.5px;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .title-wrap .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .updated{
    font-size:12px;color:var(--muted);
    background:rgba(255,255,255,0.04);
    padding:6px 12px;border-radius:20px;border:1px solid var(--border);
  }
  .updated::before{content:"🟢 ";}

  /* STATUS BAR */
  .statusbar{
    display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;
  }
  .stat{
    flex:1;min-width:90px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px 14px;text-align:center;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
    transition:.3s;
  }
  .stat:hover{transform:translateY(-4px);border-color:var(--accent)}
  .stat .num{
    font-size:26px;font-weight:800;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:1px}

  /* CONTROLS */
  .controls{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
  .controls input,.controls select{
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:11px 16px;border-radius:12px;font-size:14px;
    backdrop-filter:blur(12px);outline:none;transition:.2s;
  }
  .controls input{flex:1;min-width:220px}
  .controls input:focus,.controls select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,0.2)}
  .controls input::placeholder{color:var(--muted)}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
    transition:.3s;
    position:relative;overflow:hidden;
    animation:fadeUp .5s ease both;
  }
  .card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    opacity:.8;
  }
  .card:hover{transform:translateY(-6px);border-color:rgba(124,92,255,0.4);box-shadow:0 20px 40px rgba(0,0,0,0.5)}
  .card h2{font-size:18px;display:flex;align-items:center;gap:9px;margin-bottom:4px;font-weight:700}
  .card .desc{color:var(--muted);font-size:13px;margin-bottom:14px;min-height:36px}
  .item{
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:13px;
    transition:.2s;
  }
  .item:hover{background:rgba(124,92,255,0.08);transform:translateX(4px)}
  .item .date{color:var(--accent2);font-size:11px;display:block;margin-top:4px;font-weight:600}
  .empty{color:var(--muted);font-size:13px;font-style:italic;text-align:center;padding:14px}
  .count{
    margin-left:auto;
    background:linear-gradient(120deg,var(--accent),var(--accent2));
    color:#fff;border-radius:20px;padding:2px 11px;font-size:12px;font-weight:700;
    box-shadow:0 2px 8px rgba(124,92,255,0.4);
  }
  /* PULSE for non-empty cards */
  .card.has-items::after{
    content:"";position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;
    background:var(--green);box-shadow:0 0 0 0 rgba(63,185,80,0.6);animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(63,185,80,0.6)}
    70%{box-shadow:0 0 0 8px rgba(63,185,80,0)}
    100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}

  @media(max-width:600px){
    body{padding:20px 14px}
    .title-wrap h1{font-size:24px}
    .stat .num{font-size:22px}
  }
</style>
</head>
<body>
<header>
  <div class="title-wrap">
    <h1>🚀 Shiblu's Workspace</h1>
    <div class="sub">Daily-life automation hub · powered by Hermes Agent</div>
  </div>
  <div class="updated" id="updated"></div>
</header>

<div class="statusbar" id="statusbar"></div>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 সার্চ করুন (যেকোনো কিছু...)">
  <select id="filter">
    <option value="all">সব সেকশন</option>
    <option value="command_center">Command Center</option>
    <option value="calendar">Calendar</option>
    <option value="book_notes">Book Notes</option>
    <option value="memory_world">Memory World</option>
    <option value="research">Research</option>
    <option value="lead_pipeline">Lead Pipeline</option>
    <option value="tasks">Tasks</option>
  </select>
</div>

<div class="grid" id="grid"></div>

<footer>Hermes Agent · সরাসরি আপডেট করে · আপনার পিসিতে লোকাল</footer>

<script src="data.js"></script>
<script>
  const D = window.WORKSPACE_DATA;
  document.getElementById('updated').textContent = "Last update: " + D.updated;
  const grid = document.getElementById('grid');
  const statusbar = document.getElementById('statusbar');
  const searchInput = document.getElementById('search');
  const filterSelect = document.getElementById('filter');

  function countItems(){
    let total = 0, tasks = 0, leads = 0;
    for (const k in D.sections){
      const n = D.sections[k].items ? D.sections[k].items.length : 0;
      total += n;
      if (k==='tasks') tasks = n;
      if (k==='lead_pipeline') leads = n;
    }
    return {total, tasks, leads};
  }

  function renderStatus(){
    const c = countItems();
    statusbar.innerHTML = `
      <div class="stat"><span class="num">${c.total}</span><span class="lbl">মোট এন্ট্রি</span></div>
      <div class="stat"><span class="num">${c.tasks}</span><span class="lbl">টাস্ক</span></div>
      <div class="stat"><span class="num">${c.leads}</span><span class="lbl">লিড</span></div>
      <div class="stat"><span class="num">7</span><span class="lbl">সেকশন</span></div>
      <div class="stat"><span class="num">5</span><span class="lbl">অটোমেশন</span></div>
    `;
  }

  function renderCards(){
    const q = searchInput.value.toLowerCase().trim();
    const f = filterSelect.value;
    grid.innerHTML = "";
    let idx = 0;
    for (const key in D.sections){
      if (f !== 'all' && f !== key) continue;
      const s = D.sections[key];
      const card = document.createElement('div');
      card.className = 'card' + (s.items && s.items.length ? ' has-items' : '');
      card.style.animationDelay = (idx * 0.05) + 's';
      idx++;
      let itemsHtml = "";
      if (s.items && s.items.length){
        const filtered = s.items.filter(it =>
          !q || (it.text && it.text.toLowerCase().includes(q)) || (it.date && it.date.toLowerCase().includes(q))
        );
        if (filtered.length){
          filtered.forEach(it=>{
            itemsHtml += `<div class="item">${it.text}<span class="date">${it.date||''}</span></div>`;
          });
        } else {
          itemsHtml = `<div class="empty">— মিল পাওয়া যায়নি —</div>`;
        }
      } else {
        itemsHtml = `<div class="empty">— এখনো কিছু যোগ হয়নি —</div>`;
      }
      card.innerHTML = `
        <h2>${s.icon} ${s.title} <span class="count">${s.items?s.items.length:0}</span></h2>
        <div class="desc">${s.desc}</div>
        ${itemsHtml}
      `;
      grid.appendChild(card);
    }
  }

  searchInput.addEventListener('input', renderCards);
  filterSelect.addEventListener('change', renderCards);

  renderStatus();
  renderCards();
</script>
</body>
</html>
